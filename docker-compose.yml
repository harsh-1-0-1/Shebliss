services:
  postgres:
    image: postgres:16-alpine
    container_name: shebliss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host at all - only reachable by other
    # containers on this compose's internal network (via service name "postgres").
    # If you ever need to psql in manually from the VPS shell, use:
    #   docker exec -it shebliss_postgres psql -U $POSTGRES_USER -d $POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m
    cpus: 0.5

  redis:
    image: redis:7-alpine
    container_name: shebliss_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Also not published - internal only, reached via service name "redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    cpus: 0.25

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shebliss_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://redis:6379
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://my-store.example.com}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_JSON: ${LOG_JSON:-true}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://my-store.example.com,https://www.my-store.example.com}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      REQUIRE_CLOUDFRONT: ${REQUIRE_CLOUDFRONT:-false}
      CLOUDFRONT_SECRET: ${CLOUDFRONT_SECRET:-}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://my-store.example.com/api/v1/auth/google/callback}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - backend_static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    cpus: 0.75

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_CDN_BASE_URL: ${VITE_CDN_BASE_URL:-}
        VITE_CORPORATE_INQUIRY_ENDPOINT: ${VITE_CORPORATE_INQUIRY_ENDPOINT:-}
    container_name: shebliss_frontend
    restart: unless-stopped
    ports:
      # NOT port 80 - that's already owned by Hestia's nginx for all domains
      # on this shared VPS. This container serves on 8090 internally, and
      # Hestia's nginx vhost for my-store.example.com proxies public traffic to it.
      - "127.0.0.1:${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    cpus: 0.5

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
      - seed
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://redis:6379
    volumes:
      - backend_static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: sh -c "uv run python seed.py"
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  backend_static:
